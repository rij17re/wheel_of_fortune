<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 Jahre Jubiläum - Glücksrad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Logo Oben Rechts -->
  <img src="logo.png" alt="HAUPTSACHE SCHÖN Logo" class="top-right-logo" onerror="this.style.display='none'">

  <div class="header-container">
    <span class="subtitle-prefix">Kosmetikstudio</span>
    <div class="company-name">
      HAU(P)TSACHE SCHÖN
    </div>
    <h1>✨ 15 Jahre Jubiläum ✨</h1>
    <p class="subtitle">Drehen Sie am Glücksrad & gewinnen Sie tolle Preise!</p>
  </div>

  <div class="wheel-outer-wrapper">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
  </div>

  <button id="spinBtn" class="spin-btn">Jetzt Drehen!</button>

  <!-- Gewinn Modal -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <h2>Herzlichen Glückwunsch! 🎉</h2>
      <div id="winnerMessage" class="winner-text"></div>
      <button id="closeModalBtn" class="btn-close">Super!</button>
    </div>
  </div>

  <!-- Einstellungen / Admin -->
  <button id="adminToggleBtn" class="admin-toggle" title="Gewinne bearbeiten">⚙️</button>
  <div id="adminPanel" class="admin-panel">
    <h3>Verwaltung & Bestand</h3>
    
    <!-- Logbuch -->
    <div class="admin-section-title">📋 Gewonnene Preise Log</div>
    <div id="winnerLogList" class="log-container"></div>
    <div class="admin-btn-group">
      <button id="exportCsvBtn" class="btn-sub">💾 CSV</button>
      <button id="resetBtn" class="btn-sub btn-danger">🗑️ Reset</button>
    </div>

    <hr>

    <!-- Bestand -->
    <div class="admin-section-title">📦 Verfügbarer Bestand</div>
    <div id="inventoryList" class="inventory-container"></div>

    <hr>

    <!-- Gewinne anpassen -->
    <div class="admin-section-title">⚙️ Gewinne anpassen</div>
    <p class="help-text">Format: <em>Name : Stückzahl</em> (kommagetrennt)</p>
    <textarea id="prizesInput"></textarea>
    <button id="savePrizesBtn">Speichern & Neu starten</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
